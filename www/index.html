<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>奇幻数学岛</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=ZCOOL+KuaiLe&display=swap');
* { font-family: 'Nunito', 'PingFang SC', sans-serif; }

@keyframes float {
  0%,100% { transform: translateY(0px); }
  50%      { transform: translateY(-10px); }
}
@keyframes spin-slow { 100% { transform: rotate(360deg); } }
@keyframes pulse-glow {
  0%,100% { box-shadow: 0 8px 0 #15803d, 0 0 20px rgba(34,197,94,0.4); transform: scale(1); }
  50%      { box-shadow: 0 10px 0 #15803d, 0 0 40px rgba(34,197,94,0.7); transform: scale(1.03); }
}
@keyframes title-in {
  from { transform: translateY(-24px) scale(0.9); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}
@keyframes slide-up {
  from { transform: translateY(32px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
@keyframes halo-pulse {
  0%,100% { opacity: 0.7; transform: scale(1); }
  50%      { opacity: 1;   transform: scale(1.06); }
}

.anim-float      { animation: float 3s ease-in-out infinite; }
.anim-spin       { animation: spin-slow 20s linear infinite; }
.anim-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
.anim-title      { animation: title-in 0.7s cubic-bezier(0.34,1.4,0.64,1) both; }
.anim-slide      { animation: slide-up 0.5s ease-out both; }

/* ---- TITLE ---- */
.game-title {
  font-family: 'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: clamp(44px, 8vw, 72px);
  color: #fff;
  letter-spacing: 4px;
  line-height: 1;
  text-shadow:
    3px  3px 0 #d97706,
   -1px -1px 0 #d97706,
    1px -1px 0 #d97706,
   -1px  1px 0 #d97706,
    0    6px 0 #92400e,
    0   10px 18px rgba(0,0,0,0.25);
  position: relative;
}

/* Mode toggle */
.mode-btn { transition: all 0.2s; }
.mode-btn.active {
  background: linear-gradient(to bottom, #f59e0b, #ea580c);
  color: white;
  box-shadow: inset 0 3px 5px rgba(0,0,0,0.2), 0 4px 0 #9a3412;
  transform: translateY(2px);
}
.mode-btn.inactive {
  background: white;
  color: #d97706;
  box-shadow: 0 6px 0 #fcd34d;
}

/* Island cards */
.island-card {
  background: #7c5230;
  border-radius: 22px;
  position: relative;
  cursor: pointer;
  box-shadow: 0 8px 0 #4e3220;
  transition: all 0.28s cubic-bezier(0.34,1.4,0.64,1);
  margin-top: 22px;
}
.island-card .grass {
  border-radius: 18px 18px 8px 8px;
  padding-bottom: 12px;
  border-bottom: 4px solid rgba(0,0,0,0.15);
}
.island-card:hover {
  transform: translateY(-4px) scale(1.03);
  box-shadow: 0 14px 0 #4e3220;
}
/* Selected: scale up + thick gold ring + glowing halo */
.island-card.selected {
  transform: translateY(-10px) scale(1.1);
  box-shadow:
    0 14px 0 #4e3220,
    0 0 0 4px #fde047,
    0 0 0 8px rgba(253,224,71,0.35),
    0 0 30px 6px rgba(253,180,0,0.55);
  z-index: 10;
}
/* Animated halo ring on selected */
.island-card.selected::after {
  content: '';
  position: absolute;
  inset: -10px;
  border-radius: 30px;
  border: 3px solid #fde047;
  animation: halo-pulse 1.2s ease-in-out infinite;
  pointer-events: none;
}
/* Non-selected dims slightly */
.island-card:not(.selected) {
  opacity: 0.82;
}
.island-card:not(.selected):hover {
  opacity: 1;
}
.island-card.locked {
  cursor: not-allowed;
  filter: grayscale(0.75);
  opacity: 0.45;
}
.island-card.locked:hover {
  transform: none;
  box-shadow: 0 8px 0 #4e3220;
  opacity: 0.55;
}
.island-card.locked::before {
  content: '未解锁';
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 2;
  padding: 4px 8px;
  border-radius: 999px;
  background: rgba(68, 64, 60, 0.9);
  color: white;
  font-size: 12px;
  font-weight: 900;
}

.locked-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.locked-modal.show { display: flex; }
.locked-modal-bg {
  position: absolute;
  inset: 0;
  background: rgba(60, 35, 18, 0.45);
  backdrop-filter: blur(6px);
}
.locked-modal-card {
  position: relative;
  z-index: 1;
  width: min(340px, 100%);
  padding: 32px 28px 28px;
  border: 4px solid #fbbf24;
  border-radius: 32px;
  background: linear-gradient(160deg, #fffbeb 0%, #fff7ed 100%);
  box-shadow: 0 10px 0 #d97706, 0 20px 50px rgba(124, 45, 18, 0.3);
  text-align: center;
}
.locked-modal-emoji {
  font-size: 52px;
  line-height: 1;
  margin-bottom: 10px;
  display: block;
  animation: emoji-bounce 0.6s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes emoji-bounce {
  0% { transform: scale(0.3); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.locked-modal-title {
  color: #92400e;
  font-size: 22px;
  font-weight: 900;
  margin-bottom: 10px;
  letter-spacing: 0.02em;
}
.locked-modal-msg {
  color: #78350f;
  font-size: 16px;
  font-weight: 800;
  line-height: 1.7;
  margin-bottom: 24px;
  background: rgba(251,191,36,0.18);
  border-radius: 16px;
  padding: 10px 14px;
}
.locked-modal-btn {
  width: 100%;
  border: 0;
  border-radius: 999px;
  background: linear-gradient(180deg, #fbbf24, #f59e0b);
  color: #7c2d12;
  cursor: pointer;
  font-size: 18px;
  font-weight: 900;
  padding: 13px 0;
  box-shadow: 0 6px 0 #b45309;
  letter-spacing: 0.05em;
  transition: transform 0.1s;
}
.locked-modal-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #b45309; }

/* Stars */
.star { font-size: 1em; filter: grayscale(1) opacity(0.35); }
.star.on { filter: none; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }
</style>
</head>
<body class="h-screen w-screen overflow-hidden bg-sky-200">

<!-- ========== MAIN MENU ========== -->
<div id="menuScreen" class="absolute inset-0 flex flex-col items-center bg-gradient-to-b from-sky-300 via-amber-50 to-orange-100 overflow-y-auto overflow-x-hidden">

  <!-- Decorative bg -->
  <div class="fixed top-0 right-0 w-36 h-36 -mr-8 -mt-8 opacity-80 anim-spin pointer-events-none z-0">
    <svg viewBox="0 0 100 100" class="w-full h-full fill-yellow-300"><path d="M50 0L55 35L90 40L60 60L70 95L50 75L30 95L40 60L10 40L45 35Z"/></svg>
  </div>
  <div class="fixed top-16 left-8 text-5xl anim-float opacity-70 pointer-events-none" style="animation-delay:0s">☁️</div>
  <div class="fixed top-32 right-20 text-4xl anim-float opacity-50 pointer-events-none" style="animation-delay:1.5s">☁️</div>
  <div class="fixed bottom-20 left-12 text-3xl anim-float opacity-40 pointer-events-none" style="animation-delay:0.8s">🌿</div>
  <div class="fixed bottom-10 right-16 text-3xl anim-float opacity-40 pointer-events-none" style="animation-delay:2s">🌸</div>

  <!-- Top bar -->
  <div class="w-full max-w-4xl flex justify-between items-center px-6 pt-5 pb-1 z-10 shrink-0">
    <div class="flex items-center gap-3 bg-white/90 backdrop-blur px-4 py-2 rounded-full shadow-lg border-4 border-orange-200 anim-slide" style="animation-delay:0.1s">
      <div class="w-11 h-11 bg-blue-100 rounded-full border-2 border-white shadow-inner flex items-center justify-center text-2xl">👦</div>
      <div class="font-black text-orange-800">
        <div class="text-xs opacity-70 leading-none">见习勇士</div>
        <div class="flex items-center gap-1 text-lg text-yellow-500 leading-tight">⭐ <span id="starCount">0</span></div>
      </div>
    </div>
    <button class="w-12 h-12 bg-white/90 rounded-full shadow-lg text-2xl flex items-center justify-center border-4 border-orange-200 active:scale-95 transition-transform anim-slide" style="animation-delay:0.15s">⚙️</button>
  </div>

  <!-- Title -->
  <div class="mt-3 mb-5 text-center z-10 shrink-0 anim-title" style="animation-delay:0.05s">
    <div class="game-title">奇幻数学岛</div>
    <div class="inline-block bg-orange-500 text-white px-6 py-1.5 rounded-full mt-3 border-4 border-white shadow-md -rotate-1">
      <span class="font-black text-base tracking-widest drop-shadow">⚔️ 打败怪兽，守护和平！</span>
    </div>
  </div>

  <!-- Mode selector -->
  <div class="flex gap-3 bg-orange-100/90 p-2 rounded-3xl shadow-inner mb-6 z-10 border-4 border-orange-200 shrink-0 anim-slide" style="animation-delay:0.2s">
    <button id="btnVisual" onclick="setMode('visual')"
      class="mode-btn active px-6 py-3 rounded-2xl font-black text-base flex items-center gap-2">
      <span class="text-2xl">👀</span> 口算模式
    </button>
    <button id="btnAudio" onclick="setMode('audio')"
      class="mode-btn inactive px-6 py-3 rounded-2xl font-black text-base flex items-center gap-2">
      <span class="text-2xl">👂</span> 听算模式
    </button>
  </div>

  <!-- Level cards: 一行5个，撑满宽度 -->
  <div class="w-full max-w-4xl px-5 flex gap-4 pb-2 z-10 shrink-0" id="levelGrid" style="padding-top:28px">

    <!-- Lv1 -->
    <div id="card1" class="island-card selected anim-slide flex-1 min-w-0" style="animation-delay:0.25s" onclick="selectLevel(1)">
      <div class="grass w-full flex flex-col items-center pt-6 px-2" style="background:#3b82f6;border-color:#2563eb">
        <div class="text-5xl -mt-11 mb-1.5 drop-shadow-lg anim-float" style="animation-delay:0s;line-height:1">
          <svg viewBox="0 0 52 52" width="44" height="44">
            <!-- horns -->
            <path d="M14 6L11 16L17 10L14 6Z" fill="#8A30C0"/>
            <path d="M26 2L24 12L29 4L26 2Z" fill="#8A30C0"/>
            <path d="M38 6L41 16L35 10L38 6Z" fill="#8A30C0"/>
            <!-- head -->
            <circle cx="26" cy="28" r="18" fill="#9040C8"/>
            <circle cx="26" cy="26" r="15" fill="#A050D8" opacity="0.35"/>
            <!-- eyebrows (angry slant) -->
            <path d="M14 17.5C17 15.5 21 15.5 24 17" stroke="#3A0060" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M28 17C31 15.5 35 15.5 38 17.5" stroke="#3A0060" stroke-width="2.2" stroke-linecap="round"/>
            <!-- eyes white -->
            <ellipse cx="20" cy="23" rx="5.5" ry="5" fill="white"/>
            <ellipse cx="32" cy="23" rx="5.5" ry="5" fill="white"/>
            <!-- eyes iris -->
            <circle cx="20" cy="23.5" r="3.5" fill="#FF3300"/>
            <circle cx="32" cy="23.5" r="3.5" fill="#FF3300"/>
            <!-- pupils -->
            <circle cx="20" cy="23.5" r="2" fill="#1A0030"/>
            <circle cx="32" cy="23.5" r="2" fill="#1A0030"/>
            <!-- glints -->
            <circle cx="21" cy="22.2" r="0.9" fill="white"/>
            <circle cx="33" cy="22.2" r="0.9" fill="white"/>
            <!-- nose -->
            <ellipse cx="26" cy="29" rx="3.5" ry="2.5" fill="#7A25A8"/>
            <circle cx="24.2" cy="28.8" r="1.1" fill="#3A0060"/>
            <circle cx="27.8" cy="28.8" r="1.1" fill="#3A0060"/>
            <!-- mouth outline -->
            <path d="M16 34C19 41 33 41 36 34" fill="#3A0060"/>
            <!-- mouth fill -->
            <path d="M16 34C19 40 33 40 36 34Z" fill="#6010A0"/>
            <!-- teeth -->
            <rect x="20.5" y="34" width="2.5" height="3.5" rx="1" fill="white"/>
            <rect x="24.8" y="34.5" width="2.4" height="3" rx="1" fill="white"/>
            <rect x="29.0" y="34" width="2.5" height="3.5" rx="1" fill="white"/>
            <!-- tongue -->
            <ellipse cx="26" cy="38.5" rx="3" ry="1.8" fill="#FF4070"/>
          </svg>
        </div>
        <div class="font-black text-white text-sm drop-shadow tracking-wide">乘法入门</div>
        <div class="text-xs text-blue-100 font-bold mb-1">1~6 乘法</div>
      </div>
      <div class="py-1.5 flex justify-center gap-0 text-sm" id="stars1"><span class="star on">⭐</span><span class="star">⭐</span><span class="star">⭐</span></div>
    </div>

    <!-- Lv2 -->
    <div id="card2" class="island-card anim-slide flex-1 min-w-0" style="animation-delay:0.3s" onclick="selectLevel(2)">
      <div class="grass w-full flex flex-col items-center pt-6 px-2" style="background:#eab308;border-color:#ca8a04">
        <div class="text-5xl -mt-11 mb-1.5 drop-shadow-lg anim-float" style="animation-delay:0.5s;line-height:1">
          <!-- Rune Golem head -->
          <svg viewBox="180 75 240 200" width="44" height="44" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="rg-glow-menu" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="5" result="blur1"/>
                <feGaussianBlur stdDeviation="10" result="blur2"/>
                <feMerge><feMergeNode in="blur2"/><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <path d="M 230,160 C 230,80 370,80 370,160 Z" fill="#D3C3AD" stroke="#3A2D23" stroke-width="6" stroke-linejoin="round"/>
            <path d="M 215,225 C 215,280 250,310 300,310 C 350,310 385,280 385,225 C 360,255 240,255 215,225 Z" fill="#D3C3AD" stroke="#3A2D23" stroke-width="6" stroke-linejoin="round"/>
            <path d="M 220,180 L 220,235 C 260,250 340,250 380,235 L 380,180 Z" fill="#B19E88" stroke="#3A2D23" stroke-width="6" stroke-linejoin="round"/>
            <path d="M 210,185 C 210,150 250,150 285,160 L 315,160 C 350,150 390,150 390,185 L 390,195 C 350,175 250,175 210,195 Z" fill="#D3C3AD" stroke="#3A2D23" stroke-width="6" stroke-linejoin="round"/>
            <path d="M 285,165 L 315,165 L 325,230 L 275,230 Z" fill="#D3C3AD" stroke="#3A2D23" stroke-width="6" stroke-linejoin="round"/>
            <path d="M 235,115 C 215,100 215,80 225,60 C 235,80 245,95 235,115 Z" fill="#88C340" stroke="#3A2D23" stroke-width="4" stroke-linejoin="round"/>
            <path d="M 310,90 Q 340,65 375,85 Q 395,95 380,120 Q 365,110 330,110 Q 310,90 310,90 Z" fill="#7CB342" stroke="#3A2D23" stroke-width="4" stroke-linejoin="round"/>
            <ellipse cx="255" cy="205" rx="16" ry="14" fill="#00E5FF" filter="url(#rg-glow-menu)"/>
            <ellipse cx="255" cy="205" rx="16" ry="14" fill="#E0FFFF" stroke="#3A2D23" stroke-width="3"/>
            <circle cx="250" cy="200" r="4" fill="#FFFFFF"/>
            <ellipse cx="345" cy="205" rx="16" ry="14" fill="#00E5FF" filter="url(#rg-glow-menu)"/>
            <ellipse cx="345" cy="205" rx="16" ry="14" fill="#E0FFFF" stroke="#3A2D23" stroke-width="3"/>
            <circle cx="340" cy="200" r="4" fill="#FFFFFF"/>
          </svg>
        </div>
        <div class="font-black text-white text-sm drop-shadow tracking-wide">除法入门</div>
        <div class="text-xs text-yellow-100 font-bold mb-1">1~6 除法</div>
      </div>
      <div class="py-1.5 flex justify-center gap-0 text-sm" id="stars2"><span class="star on">⭐</span><span class="star">⭐</span><span class="star">⭐</span></div>
    </div>

    <!-- Lv3 -->
    <div id="card3" class="island-card anim-slide flex-1 min-w-0" style="animation-delay:0.35s" onclick="selectLevel(3)">
      <div class="grass w-full flex flex-col items-center pt-6 px-2" style="background:#84cc16;border-color:#4d7c0f">
        <div class="-mt-11 mb-1.5 drop-shadow-lg anim-float" style="animation-delay:1s;line-height:1">
          <svg viewBox="0 0 80 58" width="54" height="54" xmlns="http://www.w3.org/2000/svg">
            <!-- Crest feathers (5, bigger) -->
            <path d="M31,14 C27,8 28,2 31,0 C34,2 35,8 31,14Z" fill="#FF6B35"/>
            <path d="M35,11 C32,5 33,-1 36,-3 C39,-1 39,5 35,11Z" fill="#FFD700"/>
            <path d="M40,10 C37,3 38,-3 40,-5 C42,-3 43,3 40,10Z" fill="#00E5FF"/>
            <path d="M45,11 C41,5 41,-1 44,-3 C47,-1 47,5 45,11Z" fill="#FF4499"/>
            <path d="M49,14 C45,8 45,2 49,0 C52,2 53,8 49,14Z" fill="#A040FF"/>
            <!-- Head shadow -->
            <ellipse cx="41" cy="33" rx="24" ry="22" fill="rgba(0,0,0,0.08)"/>
            <!-- Head -->
            <ellipse cx="40" cy="32" rx="23" ry="22" fill="#1E88E5"/>
            <!-- Head highlight -->
            <ellipse cx="33" cy="23" rx="11" ry="8" fill="rgba(255,255,255,0.22)" transform="rotate(-26,33,23)"/>
            <!-- Eye outer ring -->
            <ellipse cx="30" cy="29" rx="10.5" ry="11.5" fill="#B3E5FC" transform="rotate(-7,30,29)"/>
            <ellipse cx="50" cy="29" rx="10.5" ry="11.5" fill="#B3E5FC" transform="rotate(7,50,29)"/>
            <!-- Eye white -->
            <ellipse cx="30" cy="29" rx="9" ry="10" fill="white" transform="rotate(-6,30,29)"/>
            <ellipse cx="50" cy="29" rx="9" ry="10" fill="white" transform="rotate(6,50,29)"/>
            <!-- Iris -->
            <circle cx="30" cy="30" r="6.5" fill="#00ACC1"/>
            <circle cx="50" cy="30" r="6.5" fill="#00ACC1"/>
            <circle cx="31" cy="30.5" r="4" fill="#006064"/>
            <circle cx="51" cy="30.5" r="4" fill="#006064"/>
            <!-- Pupil -->
            <circle cx="31.5" cy="31" r="2.8" fill="#001820"/>
            <circle cx="51.5" cy="31" r="2.8" fill="#001820"/>
            <!-- Eye shine -->
            <circle cx="33" cy="28" r="2" fill="white"/>
            <circle cx="53" cy="28" r="2" fill="white"/>
            <circle cx="29.5" cy="33" r="1" fill="white"/>
            <circle cx="49.5" cy="33" r="1" fill="white"/>
            <!-- Eyelashes -->
            <line x1="22" y1="22" x2="24" y2="18" stroke="#0D47A1" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="26" y1="19" x2="27" y2="15" stroke="#0D47A1" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="55" y1="22" x2="53" y2="18" stroke="#0D47A1" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="53" y1="19" x2="52" y2="15" stroke="#0D47A1" stroke-width="1.4" stroke-linecap="round"/>
            <!-- Upper beak -->
            <path d="M33,39 C36,35 44,35 47,39 C44,38 36,38 33,39Z" fill="#FF8C00"/>
            <!-- Lower beak -->
            <path d="M33,39 C36,45 44,45 47,39 C44,47 36,47 33,39Z" fill="#E65100"/>
            <!-- Mouth interior -->
            <path d="M35,39.5 C37,44 43,44 45,39.5 C43,45.5 37,45.5 35,39.5Z" fill="#B71C1C"/>
            <!-- Tongue -->
            <ellipse cx="40" cy="44" rx="4" ry="2.5" fill="#FF5252"/>
            <!-- Beak highlight -->
            <ellipse cx="40" cy="36.5" rx="4" ry="1.5" fill="rgba(255,220,100,0.6)"/>
            <!-- Rosy cheeks -->
            <ellipse cx="19" cy="36" rx="6" ry="4" fill="rgba(255,100,180,0.5)" transform="rotate(-11,19,36)"/>
            <ellipse cx="61" cy="36" rx="6" ry="4" fill="rgba(255,100,180,0.5)" transform="rotate(11,61,36)"/>
            <circle cx="16" cy="35" r="1.2" fill="rgba(255,80,160,0.4)"/>
            <circle cx="20" cy="37" r="1.2" fill="rgba(255,80,160,0.4)"/>
            <circle cx="24" cy="35" r="1.2" fill="rgba(255,80,160,0.4)"/>
            <circle cx="58" cy="35" r="1.2" fill="rgba(255,80,160,0.4)"/>
            <circle cx="62" cy="37" r="1.2" fill="rgba(255,80,160,0.4)"/>
            <circle cx="64" cy="35" r="1.2" fill="rgba(255,80,160,0.4)"/>
          </svg>
        </div>
        <div class="font-black text-white text-sm drop-shadow tracking-wide">乘法进阶</div>
        <div class="text-xs text-green-100 font-bold mb-1">7~9 乘法</div>
      </div>
      <div class="py-1.5 flex justify-center gap-0 text-sm" id="stars3"><span class="star on">⭐</span><span class="star on">⭐</span><span class="star">⭐</span></div>
    </div>

    <!-- Lv4 -->
    <div id="card4" class="island-card anim-slide flex-1 min-w-0" style="animation-delay:0.4s" onclick="selectLevel(4)">
      <div class="grass w-full flex flex-col items-center pt-6 px-2" style="background:#a855f7;border-color:#9333ea">
        <div class="text-5xl -mt-11 mb-1.5 drop-shadow-lg anim-float" style="animation-delay:1.5s">🚀</div>
        <div class="font-black text-white text-sm drop-shadow tracking-wide">除法进阶</div>
        <div class="text-xs text-purple-100 font-bold mb-1">7~9 除法</div>
      </div>
      <div class="py-1.5 flex justify-center gap-0 text-sm" id="stars4"><span class="star on">⭐</span><span class="star on">⭐</span><span class="star">⭐</span></div>
    </div>

    <!-- Lv5 -->
    <div id="card5" class="island-card anim-slide flex-1 min-w-0" style="animation-delay:0.45s" onclick="selectLevel(5)">
      <div class="grass w-full flex flex-col items-center pt-6 px-2" style="background:#ef4444;border-color:#b91c1c">
        <div class="text-5xl -mt-11 mb-1.5 drop-shadow-lg anim-float" style="animation-delay:2s">👑</div>
        <div class="font-black text-white text-sm drop-shadow tracking-wide">巅峰对决</div>
        <div class="text-xs text-red-100 font-bold mb-1">综合复习</div>
      </div>
      <div class="py-1.5 flex justify-center gap-0 text-sm" id="stars5"><span class="star on">⭐</span><span class="star on">⭐</span><span class="star on">⭐</span></div>
    </div>

  </div>

  <!-- Start button -->
  <button onclick="startGame()"
    class="anim-pulse-glow mt-8 mb-8 z-10 bg-gradient-to-b from-green-400 to-green-600 text-white font-black text-3xl py-4 px-24 rounded-full border-4 border-white active:scale-95 transition-transform flex items-center gap-3 shadow-xl shrink-0 anim-slide"
    style="animation-delay:0.5s">
    <span>▶</span> 出发！
  </button>

</div>

<div id="lockedModal" class="locked-modal" aria-hidden="true">
  <div class="locked-modal-bg" onclick="hideLockedModal()"></div>
  <div class="locked-modal-card" role="dialog" aria-modal="true" aria-labelledby="lockedModalTitle">
    <span class="locked-modal-emoji">🔒</span>
    <div id="lockedModalTitle" class="locked-modal-title">关卡还没解锁哦～</div>
    <div id="lockedModalMsg" class="locked-modal-msg">请先完成前面的关卡，再来挑战这一关吧！</div>
    <button type="button" class="locked-modal-btn" onclick="hideLockedModal()">好的，我知道了！</button>
  </div>
</div>

<script>
let selectedLevel = 1;
let selectedMode = 'visual';
let unlockedLevel = 1;
const TOTAL_LEVELS = 5;
const LEVEL_NAMES = ['', '乘法入门', '除法入门', '乘法进阶', '除法进阶', '巅峰对决'];

function setMode(m) {
  selectedMode = m;
  document.getElementById('btnVisual').className =
    'mode-btn ' + (m === 'visual' ? 'active' : 'inactive') + ' px-5 py-2.5 rounded-2xl font-black text-base flex items-center gap-2';
  document.getElementById('btnAudio').className =
    'mode-btn ' + (m === 'audio' ? 'active' : 'inactive') + ' px-5 py-2.5 rounded-2xl font-black text-base flex items-center gap-2';
}

function getUnlockedLevel() {
  const completedLevel = parseInt(localStorage.getItem('mathgameMaxCompletedLevel') || '0', 10);
  const safeCompletedLevel = Number.isFinite(completedLevel) ? completedLevel : 0;
  return Math.min(TOTAL_LEVELS, Math.max(1, safeCompletedLevel + 1));
}

function isLevelUnlocked(n) {
  return n <= unlockedLevel;
}

function showLockedModal(n) {
  const requiredLevel = Math.max(1, n - 1);
  const message = `请先完成前面的关卡，再来挑战这一关吧！`;
  const msg = document.getElementById('lockedModalMsg');
  const modal = document.getElementById('lockedModal');

  if (!msg || !modal) {
    alert(message);
    return;
  }

  msg.textContent = message;
  modal.classList.add('show');
  modal.style.display = 'flex';
  modal.style.zIndex = '1000';
  modal.setAttribute('aria-hidden', 'false');
}

function hideLockedModal() {
  const modal = document.getElementById('lockedModal');
  if (!modal) return;

  modal.classList.remove('show');
  modal.style.display = 'none';
  modal.setAttribute('aria-hidden', 'true');
}

function refreshLevelCards() {
  unlockedLevel = getUnlockedLevel();
  if (!isLevelUnlocked(selectedLevel)) selectedLevel = unlockedLevel;

  for (let i = 1; i <= TOTAL_LEVELS; i++) {
    const card = document.getElementById('card' + i);
    card.classList.toggle('locked', !isLevelUnlocked(i));
    card.classList.toggle('selected', i === selectedLevel);
  }
}

function selectLevel(n) {
  if (!isLevelUnlocked(n)) {
    showLockedModal(n);
    return;
  }

  selectedLevel = n;
  refreshLevelCards();
}

function startGame() {
  if (!isLevelUnlocked(selectedLevel)) {
    showLockedModal(selectedLevel);
    return;
  }

  // Pass params via sessionStorage
  sessionStorage.setItem('gameLevel', selectedLevel);
  sessionStorage.setItem('gameMode', selectedMode);
  window.location.href = 'game.html';
}

window.addEventListener('load', refreshLevelCards);
</script>
</body>
</html>
